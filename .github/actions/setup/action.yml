name: setup
description: Python 環境を用意する
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
      with:
        version: "0.13.7"
    - shell: bash
      run: |
        # uv.lock のとおりに入れる。ロックと pyproject.toml が食い違えば更新せず失敗する
        uv sync --locked --extra dev
        .venv/bin/keiba env-check
