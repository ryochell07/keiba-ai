name: test
on:
  push:
    paths-ignore: ["docs/heartbeat.txt"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/setup
      - run: .venv/bin/python -m pytest -q
