name: one-time-forward-measurement
run-name: "Private-state aggregate forward audit (one time, read only)"
# Created only for the approved one-time aggregate measurement on this feature branch.
# No code changes to main, Release, models, production data, or scheduled workflows.
on:
  push:
    branches: [audit/forward-odds-eligibility]
    paths: [.github/workflows/one-time-forward-measurement.yml]

permissions:
  contents: read

jobs:
  measure:
    if: >-
      ${{ github.repository == 'ryochell07/keiba-ai' && github.ref == 'refs/heads/audit/forward-odds-eligibility' && github.event.head_commit.message == 'audit: one-time read-only research evaluation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout validated audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pinned dependency environment (no secrets)
        uses: ./.github/actions/setup

      - name: Download encrypted backup (no decryption key in this step)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/one-time-measurement"
          gh release download state --repo "$GITHUB_REPOSITORY" \
            --pattern 'keiba-state.enc' --dir "$RUNNER_TEMP/one-time-measurement"
          test -s "$RUNNER_TEMP/one-time-measurement/keiba-state.enc"

      - name: Decrypt locally and print only aggregate performance measures
        shell: bash
        env:
          KEIBA_STATE_KEY: ${{ secrets.KEIBA_STATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          work="$RUNNER_TEMP/one-time-measurement"
          if [ -z "${KEIBA_STATE_KEY:-}" ]; then
            echo "::error::Secret is unavailable; no data was accessed"
            exit 1
          fi
          code=0
          .venv/bin/keiba reconcile --read-only \
            --encrypted-state "$work/keiba-state.enc" \
            --output "$work/private-metrics.json" \
            > "$work/internal.stdout" 2> "$work/internal.stderr" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Read-only evaluation failed; private details remain suppressed"
            exit "$code"
          fi
          # Output is deliberately restricted to aggregate counts and means.
          # No race IDs, horse IDs, timestamps, market quotes or secret keys are printed.
          .venv/bin/python - "$work/private-metrics.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              reports = json.load(f)
          if isinstance(reports, dict):
              reports = [reports]
          print("AGGREGATE_FORWARD_AUDIT_START")
          for r in reports:
              org = r["org"]
              print(f"ORG={org} PREDICTED_RACES={r.get('n_races_with_selected_prestart_run', 0)} VALID_LEGACY_RACES={r.get('n_races', 0)}")
              coverage = r.get("evaluation_coverage", {}).get("by_time_point", {})
              scores = r.get("by_time_point", {})
              paired = r.get("paired_model_comparison", {}).get("by_time_point", {})
              for tp in ("day_before", "morning", "t30", "t10", "last"):
                  c = coverage.get(tp, {})
                  if not c:
                      continue
                  selected = c.get("selected_runs", 0)
                  valid = c.get("outcome_valid", 0)
                  n = c.get("paired_scored", 0)
                  print(f"COVERAGE org={org} tp={tp} selected={selected} valid_outcomes={valid} paired={n} ai_scored={c.get('ai_scored',0)} deployed_scored={c.get('deployed_scored',0)}")
                  def fmt(x):
                      return f"{x:.6f}" if isinstance(x, (int, float)) and math.isfinite(x) else "NA"
                  m = scores.get(tp, {})
                  for model in ("ai", "market", "blend", "used_all_races"):
                      x = m.get(model, {})
                      if not x:
                          continue
                      print(f"SCORE org={org} tp={tp} model={model} n={x.get('n_races',0)} logloss={fmt(x.get('log_loss'))} brier={fmt(x.get('brier'))} hit={fmt(x.get('top1_hit'))} roi={fmt(x.get('top1_roi'))} roi_n={x.get('top1_roi_races',0)}")
                  d = paired.get(tp, {})
                  if n and d:
                      for pair in ("ai_minus_market", "blend_minus_market", "blend_minus_ai"):
                          delta = d.get(pair, {})
                          if delta:
                              print(f"DELTA org={org} tp={tp} pair={pair} n={n} logloss={fmt(delta.get('log_loss'))} brier={fmt(delta.get('brier'))} top1hit={fmt(delta.get('top1_hit_rate'))}")
          print("AGGREGATE_FORWARD_AUDIT_END")
          PY

      - name: Securely discard temporary state and reports
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/one-time-measurement/keiba-state.enc"
          rm -f "$RUNNER_TEMP/one-time-measurement/private-metrics.json"
          rm -f "$RUNNER_TEMP/one-time-measurement/internal.stdout"
          rm -f "$RUNNER_TEMP/one-time-measurement/internal.stderr"
