name: daily
# 毎朝の結果取り込み・照合・予測・ページ更新。毎月第1月曜に再学習 (旧モデルより悪ければ採用しない)。
on:
  schedule:
    - cron: "0 21 * * *"       # 06:00 JST
  workflow_dispatch:
    inputs:
      retrain: {description: "再学習する", type: boolean, default: false}
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # スケジュール維持のため、定期実行のワークフローを有効化し直す
concurrency: {group: keiba-state, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # 鍵と合言葉はジョブ全体に置かず、使うステップだけに渡す (外部アクションから読めないように)
    env:
      GH_TOKEN: ${{ github.token }}
      ALLOW_PRIVATE_RUN: ${{ vars.ALLOW_PRIVATE_RUN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/guard
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pull-state
        env:
          KEIBA_STATE_KEY: ${{ secrets.KEIBA_STATE_KEY }}
      - name: 日次処理
        env:
          RETRAIN: ${{ inputs.retrain }}
          KEIBA_SITE_PASSPHRASE: ${{ secrets.KEIBA_SITE_PASSPHRASE }}   # daily の最後にページを作る
        run: |
          ARGS=""
          dow="$(TZ=Asia/Tokyo date +%u)"; dom="$(TZ=Asia/Tokyo date +%-d)"
          if [ "$RETRAIN" = "true" ] || { [ "$dow" = "1" ] && [ "$dom" -le 7 ]; }; then ARGS="--retrain"; fi
          .venv/bin/keiba daily $ARGS
      - uses: ./.github/actions/push-state
        if: success() || failure()
        env:
          KEIBA_STATE_KEY: ${{ secrets.KEIBA_STATE_KEY }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        if: success() || failure()
        with: {path: public}
      # 送った直後の成果物は一覧に出ず「Found 0 artifact(s)」で失敗することがあるので、30秒待って1回だけやり直す
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
        if: success() || failure()
        continue-on-error: true
      - if: (success() || failure()) && steps.deploy.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
        if: (success() || failure()) && steps.deploy.outcome == 'failure'
      - name: スケジュール維持
        # 公開リポジトリは無活動が60日続くと定期実行が止まる。main は PR 必須にしたのでコミットはせず、
        # 毎月1日に定期実行のワークフローを API で有効化し直して、無活動の日数を数え直させる
        if: success()
        run: |
          [ "$(TZ=Asia/Tokyo date +%-d)" = "1" ] || exit 0
          for wf in daily.yml raceday.yml backfill.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" >/dev/null \
              || echo "::warning::$wf を有効化し直せませんでした"
          done
