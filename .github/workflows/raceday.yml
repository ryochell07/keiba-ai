name: raceday
# 発売中オッズを取得時刻付きで蓄積し、期待値を更新する。地方は毎日、中央は土日月 (祝日開催を含む)。
on:
  schedule:
    - cron: "*/30 0-12 * * *"    # 毎日 09:00-21:30 JST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: keiba-state, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      KEIBA_STATE_KEY: ${{ secrets.KEIBA_STATE_KEY }}
      KEIBA_SITE_PASSPHRASE: ${{ secrets.KEIBA_SITE_PASSPHRASE }}
      ALLOW_PRIVATE_RUN: ${{ vars.ALLOW_PRIVATE_RUN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/guard
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/pull-state
      - name: 出馬表とオッズの取得、予測更新
        run: |
          case "$(TZ=Asia/Tokyo date +%u)" in
            1|6|7)
              .venv/bin/keiba jra-cards || echo "::warning::中央の出馬表の取得に失敗"
              ;;
          esac
          # 定期実行の遅れを埋めるため、1回の実行の中で約5分おきにオッズを取得する
          rc=0
          .venv/bin/keiba race-loop --minutes 20 --interval 300 || rc=$?
          if [ "$rc" = "4" ] || [ "$rc" = "5" ]; then
            echo "::error::整合性または環境の問題で停止しました (終了コード $rc)"
            exit "$rc"
          fi
          [ "$rc" = "0" ] || echo "::warning::発走前オッズの取得で失敗がありました (終了コード $rc)"
          # 中央の当日の結果。発走から10分たって結果のないレースがなければ公式サイトへ要求しない
          rc=0
          .venv/bin/keiba jra-results || rc=$?
          if [ "$rc" = "4" ] || [ "$rc" = "5" ]; then
            echo "::error::整合性または環境の問題で停止しました (終了コード $rc)"
            exit "$rc"
          fi
          [ "$rc" = "0" ] || echo "::warning::中央の当日の結果の取得に失敗しました (終了コード $rc)"
          .venv/bin/keiba daily --no-fetch
      - uses: ./.github/actions/push-state
        if: success() || failure()
      - uses: actions/upload-pages-artifact@v3
        if: success() || failure()
        with: {path: public}
      - uses: actions/deploy-pages@v4
        if: success() || failure()
