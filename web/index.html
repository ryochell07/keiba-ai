<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>keiba-ai</title>
<style>
:root{color-scheme:light;--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--sub:#52514e;--mute:#6f6d68;--line:#e1e0d9;--axis:#c3c2b7;--acc:#0b6e4f;--acc-ink:#fff;--warn:#8a4b08;--warn-bg:#fdf1e0;--pos:#006300;--chip:#eeede7;--s1:#2a78d6;--s2:#eb6834;--ref:#898781}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--sub:#c3c2b7;--mute:#9b9a92;--line:#2c2c2a;--axis:#383835;--acc:#39b98c;--acc-ink:#07140f;--warn:#f0b36e;--warn-bg:#33261a;--pos:#2fc46a;--chip:#2a2a28;--s1:#3987e5;--s2:#d95926;--ref:#898781}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
button{font:inherit;color:inherit}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:980px;margin:auto}
h1{font-size:16px;margin:0;font-weight:700}
.meta{color:var(--sub);font-size:12.5px}
main{padding:14px 16px 96px;max-width:980px;margin:auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{border:0;background:none;padding:10px 1px 9px;font-size:12px;color:var(--sub);min-height:52px}
nav.bottom button[aria-current=page]{color:var(--acc);font-weight:700;box-shadow:inset 0 2px 0 var(--acc)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);padding:6px 12px;border-radius:999px;font-size:13px;min-height:34px}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:block;width:100%;text-align:left}
button.card{cursor:pointer}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.combo{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.names{color:var(--sub);font-size:12.5px;overflow-wrap:anywhere}
.ev{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev.pos{color:var(--pos)}.ev.neg,.ev.none{color:var(--mute);font-weight:500}
.ev.none{font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;font-size:11.5px;color:var(--mute)}
.stats b{display:block;color:var(--ink);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.flags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.flag{background:var(--warn-bg);color:var(--warn);font-size:11.5px;padding:1px 7px;border-radius:5px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--chip);color:var(--sub);white-space:nowrap}
.tag.pos{background:var(--acc);color:var(--acc-ink)}
.mk{display:inline-block;min-width:1.3em;font-weight:700;color:var(--acc)}
.pick{margin-top:6px;display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
dl.gl{margin:4px 0 0;font-size:13px}
dl.gl dt{font-weight:600;margin-top:10px}
dl.gl dd{margin:2px 0 0;color:var(--sub)}
.notice{background:var(--warn-bg);color:var(--warn);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.empty{color:var(--sub);padding:24px 8px;text-align:center}
h2{font-size:15px;margin:20px 0 8px}
h2:first-child{margin-top:0}
h3{font-size:13.5px;margin:0 0 6px;font-weight:600}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .v{font-size:20px;font-weight:600}
.tile .l{font-size:12px;color:var(--sub)}
.cols{display:grid;gap:8px}
@media (min-width:760px){.cols{grid-template-columns:1fr 1fr}.cols .wide{grid-column:1/-1}.list2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list2 .card{margin:0}}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.name{white-space:normal;min-width:96px;text-align:left}
th.l{text-align:left}
table.kv td{text-align:left;white-space:normal}
table.kv td:first-child{color:var(--sub);width:9.5em}
th{color:var(--mute);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}
.back{border:0;background:none;color:var(--acc);padding:4px 0 10px;font-weight:600;min-height:36px}
details summary{cursor:pointer;color:var(--sub);font-size:12.5px;padding:6px 0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:11px;fill:var(--mute);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3;display:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
#lock{max-width:340px;margin:18vh auto 0;padding:0 16px}
input[type=password]{width:100%;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.btn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font-weight:600;min-height:44px}
label.rem{display:flex;gap:6px;margin-top:10px;font-size:13px;color:var(--sub);align-items:center}
.err{color:var(--warn);font-size:13px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<div id="lock">
  <h1>keiba-ai</h1>
  <p class="meta">個人用の分析ページです。合言葉を入力してください。</p>
  <form id="f"><input id="pw" type="password" autocomplete="current-password" aria-label="合言葉" placeholder="合言葉">
  <label class="rem"><input id="rem" type="checkbox"> この端末で記憶する</label>
  <button class="btn">開く</button></form>
  <div class="err" id="err" role="alert"></div>
</div>
<div id="app" hidden>
<header><div class="head"><div><h1>keiba-ai</h1><div class="meta" id="gen"></div></div></div></header>
<main id="main"></main>
<nav class="bottom" id="tabs" aria-label="メイン"></nav>
</div>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function decrypt(pw){
  const res=await fetch('data.enc.json',{cache:'no-store'});if(!res.ok)throw new Error('データを読み込めません');
  const e=await res.json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
  const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function unlock(pw,remember){
  $('#err').textContent='';
  try{D=await decrypt(pw);if(remember)store('keiba-pw',pw);start()}
  catch(e){store('keiba-pw');$('#err').textContent=e.name==='OperationError'?'合言葉が違います':e.message}
}
$('#f').addEventListener('submit',ev=>{ev.preventDefault();unlock($('#pw').value,$('#rem').checked)});
let D=null;
const S={tab:'home',date:null,race:null,bet:'win',detailBet:'win',rank:'race',aorg:null,rsort:'venue',dsort:'prob',rrank:'time'};
const TABS=[['home','今日'],['races','レース'],['rank','ランキング'],['analysis','分析'],['lab','モデル'],['status','状態']];
const R={},P={};
const BET_ORDER=['win','place','bracket_quinella','quinella','wide','exacta','trio','trifecta','bracket_exacta'];
function start(){
  D.races.forEach(r=>{R[r.id]=r;P[r.id]=[]});
  D.predictions.forEach(p=>P[p.r]&&P[p.r].push(p));
  $('#lock').hidden=true;$('#app').hidden=false;
  $('#gen').textContent=fmtAt(D.generated_at)+' 更新';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}">${l}</button>`).join('');
  const dates=[...new Set(D.races.map(r=>r.date))].sort();
  const next=D.races.filter(r=>r.date>=D.today&&!started(r)).map(r=>r.date).sort()[0];S.date=next||(dates.includes(D.today)?D.today:(dates[0]||null));
  S.aorg=Object.keys(D.backtests)[0]||null;
  window.addEventListener('hashchange',route);route();
}
function go(h){if(location.hash===h)render();else location.hash=h}
function route(){const m=location.hash.match(/^#race\/(.+)$/);const rid=m&&decodeURIComponent(m[1]);if(rid&&R[rid]){S.race=rid;S.tab='races'}else{S.race=null;const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t))S.tab=t}render();window.scrollTo(0,0)}
const started=r=>!!r.time&&new Date(`${r.date}T${r.time}:00+09:00`)<new Date();
const upcoming=rows=>rows.filter(p=>!started(R[p.r]));
const raceList=()=>D.races.filter(r=>!S.date||r.date===S.date);
const inScope=()=>raceList().flatMap(r=>P[r.id]);
const label=b=>D.bet_labels[b]||b;
const md=d=>d?d.slice(5).replace('-','/'):'';
const raceLabel=r=>`${md(r.date)} ${esc(r.course)}${r.no}R ${r.time||''}`;
const pct=v=>v==null?'-':(v*100>=10?(v*100).toFixed(1):(v*100).toFixed(2))+'%';
const pct0=v=>v==null?'-':(v*100).toFixed(1)+'%';
const num=v=>v==null?'-':v>=1000?Math.round(v).toLocaleString():v.toFixed(1);
const oddsTxt=p=>p.o==null?'-':(p.m!=null?`${num(p.o)}〜${num(p.m)}`:num(p.o));
const sign=v=>(v>=0?'+':'')+(v*100).toFixed(0)+'%';
const fmtAt=s=>s?s.slice(5,16).replace('T',' ').replace('-','/'):'-';
const orgName=o=>o==='JRA'?'中央':'地方';
// 印は単勝の確率順: ◎1位 ○2位 ▲3位 △4・5位
const MARKS=['◎','○','▲','△','△'];
const winOf=rid=>P[rid].filter(p=>p.b==='win').sort((a,b)=>b.p-a.p);
const markOf=rid=>Object.fromEntries(winOf(rid).slice(0,MARKS.length).map((p,i)=>[p.c,MARKS[i]]));
const horseName=(r,u)=>r.horses.find(h=>h.u==u)?.name||'';
const bestEv=rid=>P[rid].filter(p=>p.ev!=null).sort((a,b)=>b.ev-a.ev)[0];
// 500点以上で95%区間の下限が100%を超えた買い方。これがない限り「回収率100%超」とは言わない
const sureRows=()=>Object.values(D.backtests).flatMap(b=>b.rows).filter(r=>r.n_bets>=500&&(r.roi_ci_low||0)>1);
function glossary(){const mo=(D.market_only_orgs||[]).map(orgName).join('・');
  return `<details class="card" style="margin-top:14px"><summary>用語の説明</summary><dl class="gl">
  <dt>印（◎○▲△）</dt><dd>勝率の高い順の目印です。◎が1位、○が2位、▲が3位、△が4・5位です。</dd>
  <dt>勝率・複勝率・的中確率</dt><dd>その馬が1着になる確率、複勝が当たる確率、その買い目が当たる確率の推定です。オッズが出る前はAIだけで出し、出た後はAIと単勝オッズを合成します（市場の評価が大部分を占めます）。${mo?mo+'は、オッズが揃うと単勝オッズだけで出します。':''}</dd>
  <dt>期待値</dt><dd>的中確率×オッズ−1 です。+20%なら、推定が正しければ100円あたり平均120円戻る計算です。オッズは発走まで変わります。${sureRows().length?'':'これまでの検証では、期待値プラスの買い目を買い続けても、回収率は100%を確実には超えていません（ランキングの「買い方の実績」）。'}</dd>
  <dt>信頼度 A/B/C</dt><dd>確率の推定がどれだけ安定しているかの目安で、当たりやすさではありません。推定のばらつきが大きい、出走馬の過去の出走が平均3走未満、確率が1%未満、の3つのうち当てはまる数が0ならA、1ならB、2以上ならCです。</dd>
  <dt>過去走数</dt><dd>買い目に含まれる馬の、過去の出走数の平均です。少ないほど推定が不安定です。</dd>
  <dt>オッズの「〜」</dt><dd>複勝とワイドはオッズに幅があるので、下限〜上限で表示します。期待値も同じ幅になります。</dd>
  <dt>回収率</dt><dd>払戻の合計÷購入額の合計です。100%で収支がトントンです。</dd>
  <dt>注意の表示</dt><dd>「長期回収率は未検証」は、発走前のオッズで十分な実績がないという意味です。「同条件の過去回収率」は、同じ券種で期待値プラスと判定した買い目の、過去の回収率です。</dd>
  </dl></details>`}
function evTxt(p){if(p.ev==null)return '<span class="ev none">オッズ未取得</span>';const c=p.ev>0?'pos':'neg';return `<span class="ev ${c}">${sign(p.ev)}${p.evm!=null&&p.evm!==p.ev?'〜'+sign(p.evm):''}</span>`}
function names(p){const r=R[p.r];if(!r||p.b.startsWith('bracket'))return '';return p.c.split('-').map(u=>r.horses.find(h=>h.u==u)?.name||u).map(esc).join(' - ')}
function comboCard(p,opts={}){const r=R[p.r];
  return `<button class="card" data-race="${esc(p.r)}"><div class="top"><span class="combo">${esc(label(p.b))} ${esc(p.c)}</span>${evTxt(p)}</div>
  <div class="names">${opts.noRace?'':raceLabel(r)+' '}${names(p)}</div>
  <div class="stats"><div>的中確率<b>${pct(p.p)}</b></div><div>オッズ<b>${oddsTxt(p)}</b></div><div>過去走数<b>${p.n??'-'}</b></div><div>信頼度<b>${p.cf||'-'}</b></div></div>
  ${opts.extra||''}${p.f?`<div class="flags">${p.f.map(x=>`<span class="flag">${esc(x)}</span>`).join('')}</div>`:''}</button>`}
function chips(attr,cur,opts){return `<div class="filters">${opts.map(([v,l])=>`<button class="chip" data-${attr}="${esc(v)}" aria-pressed="${cur===v}">${esc(l)}</button>`).join('')}</div>`}
function dateChips(){const ds=[...new Set(D.races.map(r=>r.date))].sort();return ds.length>1?chips('date',S.date,ds.map(d=>[d,md(d)+(d===D.today?' 今日':'')])):''}
function caution(){const m=(D.market_only_orgs||[]).map(orgName).join('・');
  return `<div class="notice">確率はAIと単勝オッズの合成です${m?`（${m}は、オッズが揃うとAIを使わず単勝オッズだけで出します）`:''}。期待値は推定で、プラスでも利益は保証されません。</div>`}
function bestOf(rid){const ps=P[rid];const e=ps.filter(p=>p.ev!=null).sort((a,b)=>b.ev-a.ev)[0];return e||ps.filter(p=>p.b==='win').sort((a,b)=>b.p-a.p)[0]}
const VIEWS={
home(){const rs=raceList();const all=inScope();const top=upcoming(all).filter(p=>p.ev!=null).sort((a,b)=>b.ev-a.ev).slice(0,10);
  const byCourse={};rs.forEach(r=>{(byCourse[r.org+r.course]=byCourse[r.org+r.course]||{org:r.org,course:r.course,n:0}).n++});
  const at=all.map(p=>p.at).filter(Boolean).sort().pop();
  const model=Object.values(D.models).map(m=>`${orgName(m.org)} ${fmtAt(m.adopted_at)}採用`).join(' / ')||'未学習';
  const errs=D.data_status.errors_7d;
  const notable=rs.filter(r=>!started(r)).map(r=>({r,b:bestOf(r.id)})).filter(x=>x.b).sort((a,b)=>(b.b.ev??-9)-(a.b.ev??-9)||b.b.p-a.b.p).slice(0,4);
  const heading=S.date===D.today?'本日の開催':`次の開催 ${md(S.date)}`;
  return dateChips()+`<h2>${heading}</h2>`+(rs.length?`<div class="grid">${Object.values(byCourse).map(c=>`<div class="tile"><div class="v">${esc(c.course)}</div><div class="l">${c.org==='JRA'?'中央':'地方'} ${c.n}レース</div></div>`).join('')}</div>`:`<div class="empty">この条件の開催はありません。</div>`)
  +`<p class="meta">予測更新 ${fmtAt(at)} ・ モデル ${model} ・ 取得エラー(7日) ${errs}件</p>`
  +`<h2>期待値上位</h2>`+(top.length?caution()+`<div class="list2">${top.map(p=>comboCard(p)).join('')}</div>`:`<div class="empty">オッズ未取得のため期待値はまだ計算できません。下のAI注目レースを確認できます。</div>`)
  +`<h2>注目レース</h2><div class="list2">${notable.map(x=>raceCard(x.r)).join('')||'<div class="empty">これから発走する予測済みのレースはありません。</div>'}</div>`},
races(){if(S.race)return raceDetail(R[S.race]);const rs=raceList();
  if(!rs.length)return dateChips()+'<div class="empty">公開中のレースはありません。</div>';
  const head=dateChips()+chips('rsort',S.rsort,[['venue','会場順'],['time','時間順']]);
  if(S.rsort==='time'){const t=[...rs].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||a.course.localeCompare(b.course,'ja'));
    const up=t.filter(r=>!started(r)),done=t.filter(started);
    return head+(up.length?`<div class="list2">${up.map(raceCard).join('')}</div>`:'<div class="empty">これから発走するレースはありません。</div>')
      +(done.length?`<details><summary>発走済み ${done.length}レース</summary><div class="list2">${done.map(raceCard).join('')}</div></details>`:'')+glossary()}
  const by={};rs.forEach(r=>(by[r.course]=by[r.course]||[]).push(r));
  return head+Object.entries(by).map(([c,l])=>`<h2>${esc(c)} ${l.length}R</h2><div class="list2">${l.map(raceCard).join('')}</div>`).join('')+glossary()},
rank(){const kinds=[['race','レース別'],['ev','期待値'],['bet','券種別'],['prob','的中確率'],['gap','人気との乖離'],['roi','買い方の実績']];
  if(S.rank==='roi')return chips('rank',S.rank,kinds)+roiView()+glossary();
  const bets=BET_ORDER.filter(b=>inScope().some(p=>p.b===b));if(!bets.includes(S.bet))S.bet=bets[0]||'win';
  let body='',all=upcoming(inScope());
  if(S.rank==='race'){const key={time:r=>r.time||'99:99',top:r=>-(winOf(r.id)[0]?.p||0),ev:r=>-(bestEv(r.id)?.ev??-9)}[S.rrank];
    const rs=raceList().filter(r=>!started(r)&&winOf(r.id).length).sort((a,b)=>{const x=key(a),y=key(b);return x<y?-1:x>y?1:0});
    body=chips('rrank',S.rrank,[['time','時間順'],['top','◎の勝率順'],['ev','期待値順']])+`<p class="meta">これから発走するレースの印（勝率の高い順）と、期待値が最も高い買い目です。◎の勝率が高いほど、本命が堅いレースです。</p>`
      +(rs.length?`<div class="list2">${rs.map(raceCard).join('')}</div>`:'<div class="empty">これから発走する予測済みのレースはありません。</div>')}

  <div class="pick">${win.slice(0,3).map((p,i)=>`<span><span class="mk">${MARKS[i]}</span><b>${esc(p.c)}</b> ${esc(horseName(r,p.c))} <span class="meta">${pct(p.p)}</span></span>`).join('')}</div>
  <div class="meta" style="margin-top:10px">券種ごとに最も当たりやすい買い目</div>
  <div class="scroll"><table><tr><th>券種</th><th>買い目</th><th>的中確率</th><th>オッズ</th><th>期待値</th></tr>${likely.map(p=>`<tr><td>${esc(label(p.b))}</td><td>${esc(p.c)}</td><td>${pct(p.p)}</td><td>${oddsTxt(p)}</td><td>${p.ev==null?'-':sign(p.ev)}</td></tr>`).join('')}</table></div>
  <p class="meta">${evNote}</p></section>
  <h2>出走馬</h2><div class="card scroll"><table><tr><th>印</th><th class="l">馬</th><th>単勝</th><th>勝率</th><th>複勝率</th><th>期待値</th></tr>${hs.map(h=>{const p=win.find(x=>x.c==h.u)||{};const pl=place[h.u]||{};return `<tr><td><span class="mk">${mk[h.u]||''}</span></td><td class="name"><b>${h.u}</b> ${esc(h.name)}<div class="meta">${esc(h.jockey||'')} ${h.cw!=null?h.cw+'kg':''}</div></td><td>${num(p.o)}${p.pop?`<div class="meta">${p.pop}人気</div>`:''}</td><td>${pct(p.p)}</td><td>${pct(pl.p)}</td><td>${p.ev==null?'未取得':sign(p.ev)}</td></tr>`}).join('')}</table></div>
  <p class="meta">勝率の高い順に並べています。期待値は単勝のものです。</p>
  <h2>券種別の買い目</h2>${chips('dbet',S.detailBet,bets.map(b=>[b,label(b)]))}${chips('dsort',S.dsort,[['prob','当たりやすい順'],['ev','期待値順']])}<div class="list2">${rows.map(p=>comboCard(p,{noRace:true})).join('')}</div>`+glossary()}
function modelCards(){const ms=Object.values(D.models).sort((a,b)=>a.org.localeCompare(b.org));if(!ms.length)return '<div class="empty">未学習</div>';
  return ms.map(m=>{let x={};try{x=JSON.parse(m.metrics||'{}')}catch(e){}const trees=(x.refit_rounds||[]).length?x.refit_rounds:(x.best_rounds||[]);
    const mo=(D.market_only_orgs||[]).includes(m.org);
    return `<div class="card"><b>${orgName(m.org)}</b><table class="kv"><tr><td>採用</td><td>${fmtAt(m.adopted_at)}</td></tr><tr><td>版</td><td>${esc(m.model_version_id)}</td></tr>
    <tr><td>学習期間</td><td>${esc(m.train_start)}〜${esc(m.train_end)}</td></tr><tr><td>学習レース数</td><td>${x.n_train_races!=null?x.n_train_races.toLocaleString():'-'}</td></tr>
    <tr><td>木の本数</td><td>${trees.length?trees.join(' / '):'-'}</td></tr><tr><td>オッズが揃った後</td><td>${mo?'単勝オッズだけで確率を出す':'AIと単勝オッズを合成'}</td></tr></table></div>`}).join('')}
function roiView(){const orgs=Object.keys(D.backtests);if(!orgs.length)return '<div class="empty">検証結果はまだありません。</div>';
  if(!orgs.includes(S.aorg))S.aorg=orgs[0];const b=D.backtests[S.aorg];
  const up=t=>Math.round((+t-1)*100);
  const how=r=>r.strategy==='top1'?'毎レース、最も当たりやすい買い目':r.strategy==='favorite_benchmark'?'1番人気（比較用）'
    :r.strategy.startsWith('blend_ev_')?`期待値+${up(r.strategy.slice(9))}%以上（合成確率）`:`期待値+${up(r.strategy.slice(3))}%以上（AI単独）`;
  const basis=r=>({final_optimistic:'確定(甘め)',cutoff:'発走前',none:'不使用',benchmark:'確定'})[r.odds_basis]||r.odds_basis;
  const verdict=r=>r.n_bets>=500&&(r.roi_ci_low||0)>1?'<span class="tag pos">100%超</span>':r.roi>1?'<span class="tag">偶然と区別できない</span>':'<span class="tag">100%未満</span>';
  const p0=v=>v==null?'-':Math.round(v*100)+'%';
  const table=rs=>`<div class="list2">${rs.map(r=>`<div class="card"><div class="top"><b>${esc(label(r.bet_type))}</b>${verdict(r)}</div><div class="names">${how(r)}</div>
    <div class="stats"><div>回収率<b>${pct0(r.roi)}</b></div><div>95%区間<b>${r.roi_ci_low==null?'-':Math.round(r.roi_ci_low*100)}〜${p0(r.roi_ci_high)}</b></div><div>点数<b>${r.n_bets.toLocaleString()}</b></div><div>判定のオッズ<b>${basis(r)}</b></div></div></div>`).join('')}</div>`;
  const all=[...b.rows].sort((x,y)=>y.roi-x.roi),main=all.filter(r=>r.n_bets>=100),sure=all.filter(r=>r.n_bets>=500&&(r.roi_ci_low||0)>1);
  return (orgs.length>1?chips('aorg',S.aorg,orgs.map(o=>[o,orgName(o)])):'')
  +(sure.length?`<div class="notice">回収率100%を超えたと言える買い方が ${sure.length}件あります。過去の成績で、将来の利益は保証されません。</div>`:'<div class="notice">回収率100%を確実に超える買い方は、まだ見つかっていません。</div>')
  +`<p class="meta">過去のデータだけで学習したAIで、その後のレース（${esc(b.period[0])}〜${esc(b.period[1])}、${b.summary.n_races.toLocaleString()}レース）を予測し、1点100円で買った計算です。「100%超」は、500点以上で95%区間の下限が100%を超えたものです。回収率が100%を超えていても、区間が100%をまたぐものは偶然と区別できません。</p>
  <p class="meta">複数の券種を組み合わせても、回収率はそれぞれの回収率を購入額で平均した値になります。100%を確実に超える券種がない限り、組み合わせても超えません。</p>
  <p class="meta">「判定のオッズ」は、買うかどうかを決めるのに使ったオッズです。「確定(甘め)」は締め切り後の最終オッズを見て決めた計算で、実際には不可能な判断を含むため良く出ます。「不使用」はオッズを見ずに決めています。</p>
  <h2>回収率の高い順（100点以上）</h2>${table(main.slice(0,12))}<details><summary>すべての買い方 ${all.length}件（100点未満を含む）</summary>${table(all)}</details>`}
function strategyTable(rows){const name={none:'オッズ不使用',final_optimistic:'確定オッズ(甘め)',cutoff:'発走前オッズ',benchmark:'基準'};const st=s=>s==='top1'?'確率最上位':s==='favorite_benchmark'?'確定1番人気':s.startsWith('blend_')?'合成 期待値'+s.replace('blend_ev_','')+'倍以上':'AI単独 期待値'+s.replace('ev_','')+'倍以上';
  const sorted=[...rows].sort((x,y)=>BET_ORDER.indexOf(x.bet_type)-BET_ORDER.indexOf(y.bet_type)||x.strategy.localeCompare(y.strategy));
  return `<div class="card scroll"><table><tr><th>券種</th><th>戦略</th><th>判定</th><th>点数</th><th>的中</th><th>回収率</th><th>95%区間</th><th>DD</th></tr>${sorted.map(r=>`<tr><td>${esc(label(r.bet_type))}</td><td>${st(r.strategy)}</td><td>${name[r.odds_basis]||esc(r.odds_basis)}</td><td>${r.n_bets}</td><td>${r.n_hits}</td><td>${pct0(r.roi)}</td><td>${pct0(r.roi_ci_low)}〜${pct0(r.roi_ci_high)}</td><td>${Math.round(r.max_drawdown||0).toLocaleString()}</td></tr>`).join('')}</table></div>`}
// ---- グラフ: 線2px・棒は上限24px・ホバーとフォーカスで値表示・表で全値を確認できる ----
function chartCard(title,sub,c){return `<section class="card"><h3>${esc(title)}</h3>${sub?`<div class="meta">${esc(sub)}</div>`:''}${c}</section>`}
const W=340,PAD={l:40,r:10,t:10,b:24};
const nice=(lo,hi,n=4)=>{const span=(hi-lo)||1,st=Math.pow(10,Math.floor(Math.log10(span/n)));const e=span/n/st;const step=(e<1.5?1:e<3?2:e<7?5:10)*st;const out=[];const top=Math.ceil(hi/step-1e-9)*step;for(let v=Math.floor(lo/step)*step;v<=top+step*.001;v+=step)out.push(+v.toFixed(6));return out};
function tableFor(head,rows){return `<details><summary>表で見る</summary><div class="scroll"><table><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div></details>`}
function lineChart(series,o){series=series.filter(s=>s.pts.length);if(!series.length)return '<div class="empty">データなし</div>';const H=170,xs=[...new Set(series.flatMap(s=>s.pts.map(p=>p.x)))].sort();const ys=series.flatMap(s=>s.pts.map(p=>p.y)).concat(o.ref!=null?[o.ref]:[]);
  const ticks=nice(Math.min(...ys),Math.max(...ys)),lo=ticks[0],hi=ticks[ticks.length-1];
  const X=x=>PAD.l+(xs.length>1?xs.indexOf(x)/(xs.length-1):.5)*(W-PAD.l-PAD.r),Y=y=>PAD.t+(1-(y-lo)/((hi-lo)||1))*(H-PAD.t-PAD.b);
  const data=JSON.stringify(series.flatMap((s,i)=>s.pts.map(p=>[X(p.x),Y(p.y),`${s.name} ${p.x} ${o.fmt(p.y)}`])));
  const lg=series.length>1?`<div class="legend">${series.map((s,i)=>`<span><i style="background:var(--s${i+1})"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  const last=xs[xs.length-1];
  return lg+`<div class="chart" data-points='${esc(data)}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="折れ線グラフ">
  ${ticks.map(t=>`<line x1="${PAD.l}" x2="${W-PAD.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===o.ref?'var(--ref)':'var(--line)'}" stroke-width="1"/><text x="${PAD.l-5}" y="${Y(t)+4}" text-anchor="end">${o.fmt(t)}</text>`).join('')}
  ${o.ref!=null&&!ticks.includes(o.ref)?`<line x1="${PAD.l}" x2="${W-PAD.r}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="var(--ref)"/>`:''}
  <text x="${PAD.l}" y="${H-6}">${esc(xs[0])}</text><text x="${W-PAD.r}" y="${H-6}" text-anchor="end">${esc(last)}</text>
  ${series.map((s,i)=>`<polyline fill="none" stroke="var(--s${i+1})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map(p=>X(p.x).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')}"/><circle cx="${X(s.pts[s.pts.length-1].x)}" cy="${Y(s.pts[s.pts.length-1].y)}" r="4" fill="var(--s${i+1})" stroke="var(--card)" stroke-width="2"/>`).join('')}
  </svg><div class="tip"></div></div>`+tableFor(['系列','時点','値'],series.flatMap(s=>{const st=Math.max(1,Math.floor(s.pts.length/12));return s.pts.filter((_,i)=>i%st===0||i===s.pts.length-1).map(p=>[s.name,p.x,o.fmt(p.y)])}))}
function barChart(items,o){items=items.filter(x=>x.v!=null);if(!items.length)return '<div class="empty">データなし</div>';const row=26,H=items.length*row+22,L=78,Rr=52;const maxV=Math.max(...items.map(x=>x.v),o.ref||0,.01);const ticks=nice(0,maxV,3);const hi=ticks[ticks.length-1];const X=v=>L+v/hi*(W-L-Rr);
  return `<div class="chart" data-points='${esc(JSON.stringify(items.map((x,i)=>[X(x.v),i*row+13,`${x.k} ${pct0(x.v)}${x.note?' '+x.note:''}`])))}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="棒グラフ">
  ${ticks.map(t=>`<line x1="${X(t)}" x2="${X(t)}" y1="0" y2="${H-20}" stroke="${t===o.ref?'var(--ref)':'var(--line)'}"/><text x="${X(t)}" y="${H-6}" text-anchor="middle">${(t*100).toFixed(0)}%</text>`).join('')}
  ${o.ref!=null&&!ticks.includes(o.ref)?`<line x1="${X(o.ref)}" x2="${X(o.ref)}" y1="0" y2="${H-20}" stroke="var(--ref)"/>`:''}
  ${items.map((x,i)=>{const w=Math.max(X(x.v)-L,1),y=i*row+5;return `<text x="${L-6}" y="${y+12}" text-anchor="end">${esc(x.k)}</text><path d="M${L} ${y}h${Math.max(w-4,0)}q4 0 4 4v8q0 4-4 4h-${Math.max(w-4,0)}z" fill="var(--s1)"/><text x="${X(x.v)+5}" y="${y+12}">${pct0(x.v)}</text>`}).join('')}
  </svg><div class="tip"></div></div>`+tableFor(['区分','回収率','内訳'],items.map(x=>[x.k,pct0(x.v),x.note||'']))}
function calibChart(c){if(!c.length)return '<div class="empty">データなし</div>';const H=200,m=Math.max(...c.flatMap(x=>[x.pred,x.actual]),.05),ticks=nice(0,m,4),hi=ticks[ticks.length-1];const X=v=>PAD.l+v/hi*(W-PAD.l-PAD.r),Y=v=>PAD.t+(1-v/hi)*(H-PAD.t-PAD.b);
  return `<div class="chart" data-points='${esc(JSON.stringify(c.map(x=>[X(x.pred),Y(x.actual),`予測${pct0(x.pred)} 実際${pct0(x.actual)} (${x.n}頭)`])))}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="予測と実際の散布図">
  ${ticks.map(t=>`<line x1="${PAD.l}" x2="${W-PAD.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${PAD.l-5}" y="${Y(t)+4}" text-anchor="end">${(t*100).toFixed(0)}%</text><text x="${X(t)}" y="${H-6}" text-anchor="middle">${(t*100).toFixed(0)}%</text>`).join('')}
  <line x1="${X(0)}" y1="${Y(0)}" x2="${X(hi)}" y2="${Y(hi)}" stroke="var(--ref)"/>
  ${c.map(x=>`<circle cx="${X(x.pred)}" cy="${Y(x.actual)}" r="5" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>`).join('')}
  </svg><div class="tip"></div></div>`+tableFor(['予測勝率帯','頭数','予測','実際'],c.map(x=>[x.bin,x.n,pct0(x.pred),pct0(x.actual)]))}
function bindCharts(){document.querySelectorAll('.chart').forEach(el=>{const pts=JSON.parse(el.dataset.points),tip=$('.tip',el),svg=$('svg',el);
  const show=e=>{const r=svg.getBoundingClientRect(),sc=r.width/svg.viewBox.baseVal.width,mx=(e.clientX-r.left)/sc,my=(e.clientY-r.top)/sc;let best=null,bd=1e9;for(const p of pts){const d=Math.hypot(p[0]-mx,(p[1]-my)*.6);if(d<bd){bd=d;best=p}}if(!best)return;tip.textContent=best[2];tip.style.display='block';tip.style.left=Math.min(Math.max(best[0]*sc,90),r.width-90)+'px';tip.style.top=best[1]*sc+'px'};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',()=>tip.style.display='none')})}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.dataset.tab===S.tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  const ds=[...new Set(D.races.map(r=>r.date))].sort();if(S.date&&!ds.includes(S.date))S.date=ds.includes(D.today)?D.today:(ds[0]||null);
  $('#main').innerHTML=VIEWS[S.tab]();bindCharts();
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.tab){S.race=null;go('#'+d.tab)}else if(d.rsort){S.rsort=d.rsort;render()}else if(d.dsort){S.dsort=d.dsort;render()}else if(d.rrank){S.rrank=d.rrank;render()}else if(d.date){S.date=d.date;render()}else if(d.rank){S.rank=d.rank;render()}else if(d.bet){S.bet=d.bet;render()}else if(d.dbet){S.detailBet=d.dbet;render()}else if(d.aorg){S.aorg=d.aorg;render()}else if(d.race){go('#race/'+encodeURIComponent(d.race))}else if(d.back){go('#races')}else if(t.id==='forget'){store('keiba-pw');t.textContent='消しました'}});
const saved=load('keiba-pw');if(saved)unlock(saved,true);
</script>
