[project]
name = "keiba-ai"
version = "0.1.0"
description = "個人利用専用の競馬AI分析システム (JRA / 地方競馬)"
requires-python = "==3.12.*"
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "charset-normalizer>=3.3",
  "cryptography>=43",
]

[project.optional-dependencies]
compare = ["xgboost>=2.1", "catboost>=1.2", "optuna>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
keiba = "keiba_ai.cli:main"

[tool.uv]
# 予測に影響する版を固定する。更新するときは差を検証してから変える
constraint-dependencies = [
  "alembic==1.20.1",
  "beautifulsoup4==4.15.0",
  "catboost==1.2.10",
  "certifi==2026.10.23",
  "cffi==2.1.1",
  "charset-normalizer==3.5.2",
  "cloudpickle==3.1.2",
  "colorlog==6.12.0",
  "contourpy==1.4.0",
  "cryptography==50.0.2",
  "cycler==0.12.1",
  "fonttools==4.68.0",
  "graphviz==0.21",
  "idna==3.20",
  "iniconfig==2.3.1",
  "joblib==1.6.0",
  "kiwisolver==1.5.1",
  "lightgbm==4.7.0",
  "lxml==6.1.3",
  "mako==1.4.3",
  "markupsafe==3.0.4",
  "matplotlib==3.11.2",
  "narwhals==2.28.0",
  "numpy==2.5.4",
  "optuna==5.0.0",
  "packaging==26.3",
  "pandas==3.1.1",
  "pillow==13.0.0",
  "plotly==7.1.0",
  "pluggy==1.7.0",
  "pycparser==3.12",
  "pygments==2.21.0",
  "pyparsing==3.3.3",
  "pytest==9.2.0",
  "python-dateutil==4.0.0",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "six==1.17.0",
  "soupsieve==4.0.1",
  "sqlalchemy==2.1.8",
  "threadpoolctl==3.8.0",
  "tqdm==4.70.1",
  "typing-extensions==4.16.0",
  "tzdata==2026.6",
  "urllib3==2.8.0",
  "xgboost==3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keiba_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 実サイトへアクセスするテスト (既定では実行しない)"]
addopts = "-m 'not network'"
